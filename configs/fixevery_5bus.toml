# fix_every storage-regret cadence sweep on sienna/5bus.
#
# Probes the hypothesis that the 5-bus storage-regret is dominated by penalised
# borrow because day-exact (`fix_every = 1`) pinning of the inter-period state of
# charge over-constrains the full-horizon evaluation model. A handful of methods
# spanning the regret range (worst, best, and diverse mid-cases) are each graded at
# `fix_every` in {1, 7, 14, 30} so a coarser cadence can be compared against the
# strictest grading.
#
# The sweep keys off its own data id `sienna/5bus_fixevery` (a symlink to the 5bus
# data) so results land in their own `outputs/sienna/5bus_fixevery.csv` rather than
# being appended to the main 5bus sweep. One seed suffices: every selected method is
# hull-based, so the clustering and reduced solution are deterministic across seeds.
inputs = ["sienna/5bus_fixevery"]

seeds = [653657]

solver      = "gurobi"
inputs_dir  = "../inputs"
outputs_dir = "../outputs"
