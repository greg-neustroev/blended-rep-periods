# 5bus — DEVELOPMENT system (Studies 1–2): sensitivity + ablation. HELD OUT of the comparison.
#
# Both sweeps write to the sienna/5bus namespace:
#   - inputs/sienna/sens_5bus.csv : sensitivity — every clustering type × normalization × tol
#     at n_rp=10 (convex weights, chain off) + greedy-hull cache validation. This is where the
#     method and its hyperparameters are chosen, and where per-method hyperparameter robustness
#     is measured (we do not presuppose conical-hull + convex is best).
#   - inputs/sienna/5bus.csv      : ablation — PROPOSED vs each single-component knockout
#     (−economic, −conic-selection, −convex-weights, −chain-split), over n_rp ∈ {5,10,20,40,80}.
# The method + hyperparameters fixed here carry over unchanged to the held-out comparison, so
# method selection is never informed by the test systems.
#
# Only k-means is seed-sensitive (the rest are deterministic); n_seeds = 3, 5bus is cheap.
inputs = [
  { sweep = "sienna/sens_5bus", data = "sienna/5bus" },
  "sienna/5bus",
]
master_seed = 382507
n_seeds     = 3
solver      = "gurobi"
inputs_dir  = "../inputs"
outputs_dir = "../outputs"
