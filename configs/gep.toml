# GEP (investment) — held-out comparison, run individually. Full clustering × weight matrix
# (7 × 4 = 28 combos, incl. convex_hull_with_null) at BOTH economic and unscaled (56 combos),
# n_rp ∈ {10,20,40,80}; also part of configs/comparison.toml. Investment regret fixes
# invested_units and re-optimizes operations (no storage chain). Ablation finding: on GEP,
# unscaled matches/beats economic on regret at low n_rp AND gives a ~1.6× faster reduced solve,
# so economic is NOT presupposed here. Only k-means/k-medoids are seed-sensitive.
inputs = ["tyndp/gep"]
master_seed = 382507
n_seeds     = 5
solver      = "gurobi"
inputs_dir  = "../inputs"
outputs_dir = "../outputs"
