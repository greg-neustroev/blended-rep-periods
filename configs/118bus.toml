# NREL-118 (storage, larger non-TYNDP network) — held-out comparison, run individually.
# Primary NREL PLEXOS source, posed as a high-renewable decarbonization storage scenario
# (carbon price + renewables ×6 + fossil halved + enlarged pumped storage; see
# inputs/nrel/118bus/README.md). Full clustering × weight matrix (28 combos) at unscaled,
# n_rp ∈ {10,20,40,80}; also part of comparison.toml. storage_regret day-exact. Storage is
# pivotal, so discrimination is on the WEIGHT axis (dirac ~3.5% vs convex ~1%; clustering a
# wash) — the large-scale companion to tyndp/p2x. Only k-means/k-medoids are seed-sensitive.
inputs = ["nrel/118bus"]
master_seed = 382507
n_seeds     = 5
solver      = "gurobi"
inputs_dir  = "../inputs"
outputs_dir = "../outputs"
