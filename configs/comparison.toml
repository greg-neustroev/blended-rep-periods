# Comparison — the full clustering × weight matrix on the HELD-OUT test systems (GEP, P2X,
# 118-bus, 5-bus GEP), which the method was never tuned on. We do not presuppose the selection
# method or the weight type: every clustering ∈ {k_means, k_medoids, hierarchical, chronological,
# convex_hull, convex_hull_with_null, conical_hull} × weight ∈ {dirac, convex, conical,
# conical_bounded} is run, at BOTH the economic and unscaled normalizations (the ablation showed
# neither dominates — economic wins storage regret while unscaled is on the Pareto front for GEP
# investment and produces an easier reduced LP; minmax is dominated and dropped here; tol
# robustness lives in the synth/hydro sensitivity study), over n_rp ∈ {10,20,40,80}. GEP and
# 5bus are investment; P2X and 118-bus are storage graded day-exact. 28 combos × 2 norms × 4
# RP = 224 arms/dataset — a large run. (convex_hull_with_null is dominated on the synth dev system
# but competitive on P2X and the strongest selector on GEP, so it is carried here.)
# NOTE: 118-bus is near-degenerate as pure dispatch — every method sits at ~0.1% regret (it
# reconstructs the optimum to ~1e-10), so it carries no discriminating signal; keep it as a
# large-scale negative control, not as evidence of method value. (5-bus, formerly degenerate as
# dispatch, is now a discriminating GEP — hence sienna/5bus — so it is a positive test.)
#
# Only k-means/k-medoids are seed-sensitive; n_seeds = 5 (the deterministic combos just repeat).
inputs = ["tyndp/gep", "tyndp/p2x", "nrel/118bus", "sienna/5bus"]
master_seed = 382507
n_seeds     = 5
solver      = "gurobi"
inputs_dir  = "../inputs"
outputs_dir = "../outputs"
