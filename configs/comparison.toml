# Comparison — the full clustering × weight matrix on the HELD-OUT test systems (GEP, P2X,
# 118-bus, 5-bus), which the method was never tuned on. We do not presuppose the selection
# method or the weight type: every clustering ∈ {k_means, k_medoids, hierarchical, chronological,
# convex_hull, convex_hull_with_null, conical_hull} × weight ∈ {dirac, convex, conical,
# conical_bounded} is run, at the economic normalization (normalization × tol robustness lives in
# the synth/hydro sensitivity study), over n_rp ∈ {10,20,40,80}. GEP is investment; the rest are
# storage graded day-exact. 28 combos × 4
# RP = 112 arms/dataset — a large run. (convex_hull_with_null is dominated on the synth dev system
# but competitive on P2X, so it is carried here to characterize that dataset-dependence.)
#
# Only k-means/k-medoids are seed-sensitive; n_seeds = 5 (the deterministic combos just repeat).
inputs = ["tyndp/gep", "tyndp/p2x", "sienna/118bus", "sienna/5bus"]
master_seed = 382507
n_seeds     = 5
solver      = "gurobi"
inputs_dir  = "../inputs"
outputs_dir = "../outputs"
