# Comparison — the full clustering × weight matrix on the HELD-OUT test systems (GEP, P2X,
# 118-bus, 5-bus), which the method was never tuned on. We do not presuppose the selection
# method or the weight type: every clustering ∈ {k_means, k_medoids, hierarchical,
# chronological, convex_hull, conical_hull} × weight ∈ {dirac, convex, conical, conical_bounded}
# is run, at the economic normalization (normalization × tol robustness lives in the synth/hydro
# sensitivity study), over n_rp ∈ {5,10,20,40,80}. GEP is investment; the rest are storage
# graded day-exact (fix_every=1) with exact-inflow injection on by default. 24 combos × 5 RP =
# 120 arms/dataset — a large run. (convex_hull_with_null is excluded from the comparison to
# bound combo count: it is dominated on the synth dev system yet competitive on P2X, and never
# strictly best on either — a dataset-dependent behavior the synth/hydro sensitivity study maps.)
#
# Only k-means/k-medoids are seed-sensitive; n_seeds = 3 (set 1 for a quick first pass, more for
# variance bars). The non-k-means/medoids combos are deterministic across seeds.
inputs = ["tyndp/gep", "tyndp/p2x", "sienna/118bus", "sienna/5bus"]
master_seed = 382507
n_seeds     = 10
solver      = "gurobi"
inputs_dir  = "../inputs"
outputs_dir = "../outputs"
