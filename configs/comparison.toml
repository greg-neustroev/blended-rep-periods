# Comparison — the full clustering × weight matrix on the HELD-OUT test systems (GEP, P2X,
# 118-bus, 5-bus GEP), which the method was never tuned on. We do not presuppose the selection
# method or the weight type: every clustering ∈ {k_means, k_medoids, hierarchical, chronological,
# convex_hull, convex_hull_with_null, conical_hull} × weight ∈ {dirac, convex, conical,
# conical_bounded} is run at the unscaled normalization (economic is dropped — it coincides with
# unscaled on these case studies; minmax was already dominated; tol robustness lives in the
# synth/hydro sensitivity study), over n_rp ∈ {10,20,40,80}. 28 combos × 4 RP = 112 arms/dataset.
# The two problem classes show a clean dichotomy: on the GENERATION-EXPANSION cases (tyndp/gep,
# sienna/5bus) discrimination lives on the CLUSTERING axis (hull selection wins); on the STORAGE
# cases (tyndp/p2x, nrel/118bus) it lives on the WEIGHT axis (blended/convex weights win, the
# clustering method is a wash). nrel/118bus is the large-scale storage case (high-renewable
# decarbonization scenario; see inputs/nrel/118bus/README.md). (convex_hull_with_null is dominated
# on the synth dev system but competitive on P2X and the strongest selector on GEP, so it is carried.)
#
# Only k-means/k-medoids are seed-sensitive; n_seeds = 5 (the deterministic combos just repeat).
inputs = ["tyndp/gep", "tyndp/p2x", "nrel/118bus", "sienna/5bus"]
master_seed = 382507
n_seeds     = 5
solver      = "gurobi"
inputs_dir  = "../inputs"
outputs_dir = "../outputs"
