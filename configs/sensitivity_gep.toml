# Sensitivity: FULL tol x normalization x init matrix on gep.
master_seed = 382507
n_seeds     = 10

solver      = "gurobi"
inputs_dir  = "../inputs"
outputs_dir = "../outputs"

# The sweep file and the data/output directory differ: this sensitivity sweep
# targets the tyndp/gep data and output namespace, so experiments it shares with the
# main tyndp/gep sweep are recorded once and skipped (not re-solved) by either run.
[[inputs]]
sweep = "tyndp/sens_gep"
data  = "tyndp/gep"
