# RTS-GMLC — large-scale / RP-scaling case (Study 4), RUN LAST.
# 5-minute data with 6-hour periods (72-step, 1464 base periods, 105408-step year), so it is
# the one case that scales RP into the hundreds. inputs/gridmod/rts.csv runs the comparison
# arms at n_rp ∈ {5,10,20,40,80} plus a PROPOSED-only extension at {160,320,500} for the
# runtime / weight-fit-bottleneck curve. Every solve is heavy: run only after Studies 1–3, and
# trim the largest RP counts (320, 500) if time is short. Skippable without affecting 1–3.
inputs = ["gridmod/rts"]
master_seed = 382507
n_seeds     = 3
solver      = "gurobi"
inputs_dir  = "../inputs"
outputs_dir = "../outputs"
