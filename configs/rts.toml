# RTS-GMLC — large-scale / RP-scaling case, RUN LAST. 5-minute data with 6-hour periods
# (72-step, 1464 base periods, 105408-step year), so it scales RP into the hundreds. Too large
# for the full weight × clustering matrix, so it runs a REDUCED comparison — six arms: the four
# dirac baselines (k_means/k_medoids/hierarchical/chronological) plus convex_hull+convex and
# conical_hull+conical — each at n_rp ∈ {20,40,80,160,320}. economic normalization; storage
# day-exact. Every solve is heavy: run only after the
# other studies, and trim {160,320} if time is short. Only k-means/k-medoids are seed-sensitive.
inputs = ["gridmod/rts"]
master_seed = 382507
n_seeds     = 5
solver      = "gurobi"
inputs_dir  = "../inputs"
outputs_dir = "../outputs"
