# Full revision campaign, cheap → expensive. Held-out methodology:
#   development (synth/hydro): sensitivity (clustering × weight × normalization × tol) + ablation
#   held-out comparison (5-bus / 118-bus / P2X / GEP): full clustering × weight matrix at economic
#   large-scale (RTS, last): reduced comparison + RP scaling into the hundreds
#
# The dev system is now the synthetic binding-storage network (synth/hydro), not 5bus: post
# exact-inflow injection 5bus is run-of-river and insensitive to every method choice, so it can
# no longer tune anything — it moves to the held-out comparison, and synth/hydro (large seasonal
# reservoirs that bind) becomes the dev system that actually stresses the reduction. We
# presuppose neither the selection method nor the weight type; storage is graded day-exact
# (fix_every=1) with exact-inflow injection on by default. All arms dedup by name (resume-safe).
# Only k-means/k-medoids are seed-sensitive; the comparison is 120 arms/dataset, so a first pass
# with n_seeds=1 is cheap. Stop before RTS if time is short — everything earlier is useful.
inputs = [
  { sweep = "synth/sens_hydro", data = "synth/hydro" },  # sensitivity   (synth, dev)
  "synth/hydro",                                          # ablation      (synth, dev)
  "sienna/5bus",                                          # comparison    (held out)
  "sienna/118bus",                                        # comparison    (held out)
  "tyndp/p2x",
  "tyndp/gep",
  "gridmod/rts",                                          # large-scale   (last)
]
master_seed = 382507
n_seeds     = 10
solver      = "gurobi"
inputs_dir  = "../inputs"
outputs_dir = "../outputs"
