# Case studies run by `julia main.jl`.
#
# Each entry in `inputs` is a case study: a dataset directory under `inputs_dir`
# with a matching `<input>.csv` file listing that case study's per-experiment
# parameter sweep (one experiment per row).
inputs = ["tyndp/gep", "tyndp/p2x", "sienna/5bus", "sienna/118bus", "gridmod/rts"]

# Random seeds. `n_seeds` values are drawn from `1:seed_max` using `master_seed`,
# i.e. `Random.seed!(master_seed); rand(1:seed_max, n_seeds)`. Set an explicit
# `seeds = [...]` to use fixed seeds instead of drawing them.
master_seed = 123
n_seeds     = 10
seed_max    = 1000

# Optimizer to use (see `BlendedClustering.Experiments.SOLVERS` for supported names).
solver = "gurobi"

# Input/output roots, resolved relative to this file's directory when not absolute.
inputs_dir  = "inputs"
outputs_dir = "outputs"
